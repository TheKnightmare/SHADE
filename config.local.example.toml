# Copy to config.local.toml only if that file does not exist; merge otherwise.
[source_packs]
enabled = ["cyber", "communications", "energy", "regional", "transportation", "local-official", "local-community", "top-news"]
[relevance]
minimum_score = 45
max_age_hours = 168
# Optional request contact override without changing the base station file:
# [collection]
# user_agent = "SHADE/0.3 (set-a-real-contact@example.invalid)"

# Operator-approved chatter only. Mirrors must share the originating family.
[[sources]]
id = "community-example"
kind = "rss"
name = "Operator-approved community feed"
url = "https://example.org/feed.xml"
source_type = "community"
source_family = "example-origin"
category = "chatter"
enabled = false
emcomm_only = false
min_poll_seconds = 3600

# Public Telegram previews: text and metadata only; keep a conservative
# 30–60 minute interval because all channels share one upstream domain.
[[sources]]
id = "telegram-geopwatch"
kind = "telegram_preview"
name = "GeoPWatch Telegram preview"
url = "https://t.me/s/GeoPWatch"
source_type = "community"
