# Copy to config.local.toml only if that file does not exist; merge otherwise.
[source_packs]
enabled = ["cyber", "communications", "energy", "regional", "transportation", "local-official", "local-community", "top-news"]

# Keyword-driven Google News RSS search. Set keyword_tier to local, regional,
# national, or global; or provide query_terms for a single explicit term.
[[sources]]
id = "google-news-national"
kind = "google_news_search"
name = "Google News national keyword scan"
url = "https://news.google.com/rss/search"
source_type = "media"
source_family = "google-news"
category = "top-news"
keyword_tier = "national"
enabled = false
min_poll_seconds = 1800
[relevance]
minimum_score = 45
max_age_hours = 168

[[sources]]
id = "wzdx-registry"
kind = "wzdx_registry"
name = "USDOT WZDx Feed Registry"
url = "https://data.transportation.gov/api/v3/views/69qe-yiui/query.json?accessType=DOWNLOAD"
source_type = "official"
source_family = "wzdx-registry"
category = "transportation"
enabled = false
min_poll_seconds = 1800
# If a registered feed requires authentication, set api_key_env to the
# operator-approved environment variable; never put the key in TOML.
# api_key_env = "WZDX_API_KEY"

[[sources]]
id = "nps-alerts"
kind = "nps_alerts"
name = "National Park Service alerts"
url = "https://developer.nps.gov/api/v1/alerts?limit=50"
source_type = "official"
source_family = "nps"
category = "public-safety"
park_codes = ["grsm"]
api_key_env = "NPS_API_KEY"
enabled = false
min_poll_seconds = 900

[[sources]]
id = "inciweb-active"
kind = "inciweb"
name = "InciWeb active incidents"
url = "https://inciweb.wildfire.gov/incidents/rss.xml"
source_type = "official"
source_family = "inciweb"
category = "public-safety"
region_terms = ["Pisgah", "Cherokee", "Daniel Boone", "Tennessee", "North Carolina"]
enabled = false
min_poll_seconds = 900

[[sources]]
id = "ipaws-archive"
kind = "ipaws_archive"
name = "FEMA IPAWS archived alerts (24-hour delayed)"
url = "https://www.fema.gov/api/open/v1/IpawsArchivedAlerts?$top=1000"
source_type = "official"
source_family = "ipaws-archive"
category = "public-safety"
enabled = false
min_poll_seconds = 3600
# Optional request contact override without changing the base station file:
# [collection]
# user_agent = "SHADE/0.3 (set-a-real-contact@example.invalid)"

[[sources]]
id = "usgs-water-placeholder"
kind = "usgs_waterservices"
name = "USGS Water Services gauge placeholder"
url = "https://waterservices.usgs.gov/nwis/iv/"
source_type = "official"
source_family = "usgs-waterservices"
category = "regional"
area = "ETN/WNC"
enabled = false
sites = ["SITE_NUMBER_HERE"]
parameters = ["00060", "00065"]
min_poll_seconds = 900

[[sources]]
id = "epa-radnet-knoxville"
